# Dependency-Track 리버스 프록시
# 웹 UI와 API는 호스트가 다르다. 브라우저는 UI에서 API_BASE_URL로 API를 직접 호출한다.
# BOM, VEX 업로드는 API로 가므로 API의 본문 제한과 제한 시간만 늘린다.
# 기본 설정이다. 배포 환경에 맞게 server_name, 인증서 경로, 업스트림 주소를 수정한다.
# http 컨텍스트에 포함한다 (예: /etc/nginx/conf.d/dependency-track.conf).

upstream dtrack-frontend {
    # Nginx가 컨테이너이면 같은 네트워크의 컨테이너 이름(dtrack-frontend:8080)으로 바꾼다
    server 127.0.0.1:8083;
}

upstream dtrack-api {
    # Nginx가 컨테이너이면 같은 네트워크의 컨테이너 이름(dtrack-api:8080)으로 바꾼다
    server 127.0.0.1:8082;
}

server {
    listen 80;
    listen [::]:80;
    server_name dependency-track.example.com dependency-track-api.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dependency-track.example.com;

    ssl_certificate     /etc/nginx/certs/dependency-track.example.com.crt;
    ssl_certificate_key /etc/nginx/certs/dependency-track.example.com.key;

    location / {
        proxy_pass http://dtrack-frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dependency-track-api.example.com;

    ssl_certificate     /etc/nginx/certs/dependency-track-api.example.com.crt;
    ssl_certificate_key /etc/nginx/certs/dependency-track-api.example.com.key;

    # BOM, VEX 업로드. 더 큰 문서를 올리면 이 값과 Caddy 설정을 함께 늘린다
    client_max_body_size 256m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://dtrack-api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
