# API server와 프론트엔드는 둘 다 컨테이너 포트 8080을 써서 Pod를 나눈다.
# PostgreSQL은 포함하지 않는다. ConfigMap dtrack-api, Secret dtrack-db로 접속 정보를 넘긴다.
apiVersion: v1
kind: Pod
metadata:
  name: dtrack
  namespace: dtrack
  labels:
    app: dtrack
spec:
  restartPolicy: Always
  terminationGracePeriodSeconds: 60
  containers:
    - name: apiserver
      image: docker.io/dependencytrack/apiserver:latest
      ports:
        - containerPort: 8080
          hostPort: 8082
          hostIP: 127.0.0.1
        # 관리 포트(상태 확인 /health, 메트릭 /metrics). 필요하면 열어도 된다
        # 메트릭은 DT_METRICS_ENABLED=true일 때만 나온다
        # - containerPort: 9000
        #   hostPort: 9000
        #   hostIP: 127.0.0.1
      envFrom:
        - configMapRef:
            name: dtrack-api
        - secretRef:
            name: dtrack-db
      resources:
        limits:
          # 힙은 이미지 기본 MaxRAMPercentage=80으로 이 제한의 80%다
          memory: 4Gi
      volumeMounts:
        - name: dtrack-data
          mountPath: /data
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - NET_RAW
            - NET_ADMIN
      # 관리 포트 9000의 상태 확인 경로. 공식 문서의 프로브와 같다
      startupProbe:
        httpGet:
          path: /health/started
          port: 9000
        periodSeconds: 10
        failureThreshold: 36
      livenessProbe:
        httpGet:
          path: /health/live
          port: 9000
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 5

  volumes:
    - name: dtrack-data
      persistentVolumeClaim:
        claimName: dtrack-data

---
apiVersion: v1
kind: Pod
metadata:
  name: dtrack-frontend
  namespace: dtrack
  labels:
    app: dtrack
spec:
  restartPolicy: Always
  containers:
    - name: frontend
      image: docker.io/dependencytrack/frontend:latest
      ports:
        - containerPort: 8080
          hostPort: 8083
          hostIP: 127.0.0.1
      envFrom:
        - configMapRef:
            name: dtrack-frontend
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - NET_RAW
            - NET_ADMIN
      livenessProbe:
        httpGet:
          path: /
          port: 8080
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dtrack-data
  namespace: dtrack
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
# default.env와 같은 값
apiVersion: v1
kind: ConfigMap
metadata:
  name: dtrack-api
  namespace: dtrack
data:
  TZ: "Asia/Seoul"
  # host.containers.internal은 Podman이 호스트 주소로 넣어 준다. 127.0.0.1에만 열린 DB에는 닿지 않는다
  DT_DATASOURCE_URL: "jdbc:postgresql://host.containers.internal:5432/dtrack"
  DT_DATASOURCE_USERNAME: "dtrack"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dtrack-frontend
  namespace: dtrack
data:
  TZ: "Asia/Seoul"
  # 브라우저가 여는 API 주소
  API_BASE_URL: "http://localhost:8082"

---
apiVersion: v1
kind: Secret
metadata:
  name: dtrack-db
  namespace: dtrack
type: Opaque
stringData:
  # 실행 전 실제 비밀번호로 교체. 비밀번호를 넣은 pod.yaml은 커밋하지 않는다
  DT_DATASOURCE_PASSWORD: "dtrack"
