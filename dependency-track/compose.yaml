# v5는 API server와 프론트엔드가 필요하다. 단일 컨테이너 이미지가 없다.
# PostgreSQL은 포함하지 않는다. default.env, .env의 DT_DATASOURCE_*로 접속 정보를 넘긴다.
services:
  apiserver:
    image: docker.io/dependencytrack/apiserver:latest
    container_name: dtrack-api
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - default.env
      - path: .env
        required: false
    # Podman은 host.containers.internal을 자동으로 넣는다. Docker에서도 같은 이름을 쓰게 한다
    extra_hosts:
      - "host.containers.internal:host-gateway"
    ports:
      - "127.0.0.1:8082:8080"
      # 관리 포트(상태 확인 /health, 메트릭 /metrics). 필요하면 열어도 된다
      # 메트릭은 DT_METRICS_ENABLED=true일 때만 나온다
      # - "127.0.0.1:9000:9000"
    volumes:
      # 이미지는 1000:0으로 실행하고 /data는 dtrack:0, g=u다
      # 이름 있는 볼륨은 처음 쓸 때 이 소유자를 복사한다
      - dtrack-data:/data
    # 힙은 이미지 기본 MaxRAMPercentage=80으로 이 제한의 80%다
    mem_limit: 4g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    healthcheck:
      # 이미지 HEALTHCHECK와 같다. 이미지에 curl이 없어 BusyBox wget을 쓴다
      test: ["CMD", "wget", "-q", "-Y", "off", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      # 첫 실행은 스키마 마이그레이션이 끝나야 응답한다
      start_period: 180s

  frontend:
    image: docker.io/dependencytrack/frontend:latest
    container_name: dtrack-frontend
    restart: unless-stopped
    # default.env, .env는 DB 비밀번호가 있어 넘기지 않는다
    environment:
      TZ: Asia/Seoul
      # 브라우저가 여는 API 주소. .env의 API_BASE_URL로 바꾼다
      # 프론트엔드 컨테이너는 API에 접속하지 않고 정적 파일만 제공한다
      API_BASE_URL: "${API_BASE_URL:-http://localhost:8082}"
    ports:
      - "127.0.0.1:8083:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dtrack-data:
