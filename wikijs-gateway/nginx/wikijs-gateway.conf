# Wiki.js Gateway 리버스 프록시
# 읽기 API와 /mcp 읽기 도구는 인증이 없으므로 사이트 전체를 내부망에서만 허용한다.
# 쓰기 API는 게이트웨이가 GATEWAY_ADMIN_TOKEN으로 따로 확인한다.
# /mcp는 Streamable HTTP(SSE)라 버퍼링을 끄고 읽기 제한 시간을 늘린다.
# 기본 설정이다. 배포 환경에 맞게 server_name, 인증서 경로, 업스트림 주소, 허용 대역을 수정한다.
# http 컨텍스트에 포함한다 (예: /etc/nginx/conf.d/wikijs-gateway.conf).

# 허용 대역. 1이면 허용
# 다른 프록시나 로드밸런서 뒤에 있으면 set_real_ip_from, real_ip_header로
# 실제 클라이언트 IP를 먼저 복원해야 한다.
# rootless Podman에서 포트 포워딩이 원본 IP를 보존하지 않으면(rootlessport 등)
# 모든 요청이 내부 IP로 보여 차단이 무력화된다.
geo $wikijs_gateway_allowed {
    default         0;
    127.0.0.0/8     1;
    ::1             1;
    10.0.0.0/8      1;
    172.16.0.0/12   1;
    192.168.0.0/16  1;
    fc00::/7        1;
}

upstream wikijs-gateway {
    # Nginx가 컨테이너이면 같은 네트워크의 컨테이너 이름(wikijs-gateway:8080)으로 바꾼다
    server 127.0.0.1:28081;
}

server {
    listen 80;
    listen [::]:80;
    server_name wikijs-gateway.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wikijs-gateway.example.com;

    ssl_certificate     /etc/nginx/certs/wikijs-gateway.example.com.crt;
    ssl_certificate_key /etc/nginx/certs/wikijs-gateway.example.com.key;

    if ($wikijs_gateway_allowed = 0) {
        return 403;
    }

    # upsert로 페이지 전체를 올린다. 더 큰 페이지를 쓰면 이 값과 Caddy 설정을 함께 늘린다
    client_max_body_size 16m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # MCP Streamable HTTP. 응답을 SSE로 흘려보낸다
    location ^~ /mcp {
        proxy_pass http://wikijs-gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://wikijs-gateway;
    }
}
