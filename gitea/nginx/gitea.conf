# Gitea 리버스 프록시
# 28부터 알림 수와 스톱워치가 WebSocket(/-/ws)을 쓰므로 Upgrade 헤더를 넘긴다.
# 넘기지 않으면 실시간 갱신 대신 폴링으로 동작한다.
# 기본 설정이다. 배포 환경에 맞게 server_name, 인증서 경로, 업스트림 주소를 수정한다.
# http 컨텍스트에 포함한다 (예: /etc/nginx/conf.d/gitea.conf).
# Git SSH(2222)는 이 프록시를 거치지 않는다.

map $http_upgrade $gitea_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream gitea {
    # Nginx가 컨테이너이면 같은 네트워크의 컨테이너 이름(gitea:3000)으로 바꾼다
    server 127.0.0.1:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name gitea.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gitea.example.com;

    ssl_certificate     /etc/nginx/certs/gitea.example.com.crt;
    ssl_certificate_key /etc/nginx/certs/gitea.example.com.key;

    # HTTP push, LFS, 패키지, 릴리스 첨부 업로드가 기본 제한(1m)에 막히지 않게 한다
    client_max_body_size 512m;

    location / {
        proxy_pass http://gitea;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gitea_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 큰 저장소 clone, push가 기본 60초를 넘을 수 있다
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
