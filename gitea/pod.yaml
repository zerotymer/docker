apiVersion: v1
kind: Pod
metadata:
  name: gitea
  namespace: gitea
  labels:
    app: gitea
spec:
  restartPolicy: Always
  containers:
    - name: gitea
      image: docker.gitea.com/gitea:1.26.1
      ports:
        - containerPort: 3000
          hostPort: 3000
        - containerPort: 22
          hostPort: 2222
      envFrom:
        - configMapRef:
            name: gitea-default
      volumeMounts:
        - name: gitea-vol
          mountPath: /data
      securityContext:
        allowPrivilegeEscalation: false
      startupProbe:
        httpGet:
          path: /api/healthz
          port: 3000
        periodSeconds: 5
        failureThreshold: 12
      livenessProbe:
        exec:
          command: ["curl", "-fsS", "http://localhost:3000/api/healthz"]
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3

  volumes:
    - name: gitea-vol
      persistentVolumeClaim:
        claimName: gitea-vol

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-vol
  namespace: gitea
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-default
  namespace: gitea
data:
  TZ: "Asia/Seoul"
  USER_UID: "1000"
  USER_GID: "1000"
