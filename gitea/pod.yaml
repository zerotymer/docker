apiVersion: v1
kind: Pod
metadata:
  name: gitea
  namespace: gitea
  labels:
    app: gitea
spec:
  restartPolicy: Always
  containers:
    - name: gitea
      image: docker.gitea.com/gitea:latest-rootless
      ports:
        - containerPort: 3000
          hostPort: 3000
          hostIP: 127.0.0.1
        - containerPort: 2222
          hostPort: 2222
      envFrom:
        - configMapRef:
            name: gitea-default
      volumeMounts:
        - name: gitea-data
          mountPath: /var/lib/gitea
        - name: gitea-config
          mountPath: /etc/gitea
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - NET_RAW
            - NET_ADMIN
      startupProbe:
        exec:
          command: ["curl", "-fsS", "http://localhost:3000/api/healthz"]
        periodSeconds: 5
        failureThreshold: 12
      livenessProbe:
        exec:
          command: ["curl", "-fsS", "http://localhost:3000/api/healthz"]
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3

  volumes:
    - name: gitea-data
      persistentVolumeClaim:
        claimName: gitea-data
    - name: gitea-config
      persistentVolumeClaim:
        claimName: gitea-config

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: gitea
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-config
  namespace: gitea
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Mi

---
# default.env와 같은 값을 유지한다. 주소는 실제 값으로 바꾼다
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-default
  namespace: gitea
data:
  TZ: "Asia/Seoul"
  GITEA__server__ROOT_URL: "http://localhost:3000/"
  GITEA__server__HTTP_PORT: "3000"
  GITEA__server__SSH_DOMAIN: "localhost"
  GITEA__server__START_SSH_SERVER: "true"
  GITEA__server__SSH_PORT: "2222"
  GITEA__server__SSH_LISTEN_PORT: "2222"
  GITEA__server__LFS_START_SERVER: "true"
  GITEA__database__DB_TYPE: "sqlite3"
  GITEA__database__PATH: "/var/lib/gitea/data/gitea.db"
  GITEA__service__DISABLE_REGISTRATION: "true"
  GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
  GITEA__service__REGISTER_EMAIL_CONFIRM: "false"
  GITEA__mailer__ENABLED: "false"
  GITEA__openid__ENABLE_OPENID_SIGNIN: "false"
  GITEA__openid__ENABLE_OPENID_SIGNUP: "false"
  GITEA__actions__ENABLED: "true"
  GITEA__log__LEVEL: "Info"
  GITEA__time__DEFAULT_UI_LOCATION: "Asia/Seoul"
