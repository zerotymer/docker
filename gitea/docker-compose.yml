# =============================================================================
# Gitea - Docker Compose (공식 이미지 docker.gitea.com/gitea, 2026-10 기준)
# -----------------------------------------------------------------------------
# 프로파일 (둘 중 하나만 기동 - 포트 동일):
#   latest : 28.1.0  최신 라인. 28.0 부터 "1." 접두어 제거 (1.28 이 아니라 28)
#   stable : 1.27.3  1.x 마지막 라인, 성숙도 높음. 28 의 breaking change 대비 전 단계
#
#   docker compose --profile latest up -d
#   docker compose --profile stable up -d
#   (기본 프로파일 고정: .env 에 COMPOSE_PROFILES=stable 등 지정)
#
# ⚠ 데이터 디렉터리를 버전별로 분리함 (.data-latest / .data-stable)
#   Gitea 는 기동 시 DB 마이그레이션을 수행하며 "다운그레이드 불가".
#   28 로 한 번 띄운 데이터를 1.27 로 되돌릴 수 없으므로 절대 공유하지 말 것.
#   stable → latest 이관: 백업 후 .data-stable 을 .data-latest 로 복사하여 기동
#
# 이전 라인: 1.26.x 는 1.27.0 출시(2026-07) 이후 패치 중단 → 제외
# =============================================================================

name: gitea

x-gitea-common: &gitea-common
  restart: always
  ports:
    - "3000:3000"
    - "2222:22"
  env_file:
    - path: ./default.env
      required: true
    - path: ./.env
      required: false
  security_opt:
    - no-new-privileges:true
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s

services:

  # ---------------------------------------------------------------------------
  # latest : Gitea 28.x
  #   1.27 → 28 주요 breaking change (업그레이드 전 확인):
  #   - [server] DOMAIN 무시 → GITEA__server__ROOT_URL 필수
  #   - 셀프 회원가입 기본 비활성 (필요 시 명시적으로 허용)
  #   - 실시간 알림이 WebSocket(/-/ws) 으로 변경 → 리버스 프록시 Upgrade 헤더 전달 필요
  #   - Actions 완료 run 기본 400일 후 삭제 → 유지하려면 [actions] RUN_RETENTION_DAYS=0
  #   - 마이그레이션/미러 egress 가 내부 프록시 경유, [migrations] ALLOWED/BLOCKED_DOMAINS 등 deprecated
  # ---------------------------------------------------------------------------
  gitea-latest:
    <<: *gitea-common
    profiles: [latest]
    image: docker.gitea.com/gitea:28.1.0
    container_name: gitea-latest
    volumes:
      - ./.data-latest:/data:Z

  # ---------------------------------------------------------------------------
  # stable : Gitea 1.27.x (1.x 최종 라인)
  #   - 28.0 출시 이후 추가 패치는 기대하기 어려움 (이전 1.26 도 1.27 출시 후 중단)
  #   - 운영 안정성 확보용 단기 선택지, 28 검증 후 이관 권장
  # ---------------------------------------------------------------------------
  gitea-stable:
    <<: *gitea-common
    profiles: [stable]
    image: docker.gitea.com/gitea:1.27.3
    container_name: gitea-stable
    volumes:
      - ./.data-stable:/data:Z