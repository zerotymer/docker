# Wiki.js 리버스 프록시
# GraphQL 구독(/graphql-subscriptions)은 WebSocket을 쓰므로 Upgrade 헤더를 넘긴다.
# 업로드 본문 제한은 Wiki.js 관리 화면의 업로드 제한보다 크게 둔다.
# 기본 설정이다. 배포 환경에 맞게 server_name, 인증서 경로, 업스트림 주소를 수정한다.
# http 컨텍스트에 포함한다 (예: /etc/nginx/conf.d/wiki.js.conf).

# 다른 conf.d 파일과 변수 이름이 겹치지 않게 서비스 이름을 붙인다
map $http_upgrade $wikijs_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream wikijs {
    # Nginx가 컨테이너이면 같은 네트워크의 컨테이너 이름(wikijs:3000)으로 바꾼다
    server 127.0.0.1:3001;
}

server {
    listen 80;
    listen [::]:80;
    server_name wiki.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wiki.example.com;

    ssl_certificate     /etc/nginx/certs/wiki.example.com.crt;
    ssl_certificate_key /etc/nginx/certs/wiki.example.com.key;

    # 파일 업로드. Wiki.js 기본 제한은 파일당 5MB, 한 번에 10개다
    # 관리 화면에서 제한을 늘리면 이 값과 Caddy 설정을 함께 늘린다
    client_max_body_size 64m;

    location / {
        proxy_pass http://wikijs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $wikijs_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
