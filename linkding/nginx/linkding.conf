# linkding 리버스 프록시
# 북마크 HTML 가져오기와 첨부 파일 업로드를 위해 요청 크기를 늘린다.
# HTTPS 주소로 열면 linkding에 LD_CSRF_TRUSTED_ORIGINS=https://<호스트>를 설정해야 로그인할 수 있다.
# 기본 설정이다. 배포 환경에 맞게 server_name, 인증서 경로, 업스트림 주소를 수정한다.
# http 컨텍스트에 포함한다 (예: /etc/nginx/conf.d/linkding.conf).

upstream linkding {
    # Nginx가 컨테이너이면 같은 네트워크의 컨테이너 이름(linkding:9090)으로 바꾼다
    server 127.0.0.1:9090;
}

server {
    listen 80;
    listen [::]:80;
    server_name linkding.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name linkding.example.com;

    ssl_certificate     /etc/nginx/certs/linkding.example.com.crt;
    ssl_certificate_key /etc/nginx/certs/linkding.example.com.key;

    client_max_body_size 100m;

    location / {
        proxy_pass http://linkding;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
