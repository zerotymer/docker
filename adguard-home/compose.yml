services:
  adguard-home:
    container_name: adguard-home
    image: docker.io/adguard/adguardhome:latest
    restart: unless-stopped
    ports:
      # DNS
      - "53:53/tcp"
      - "53:53/udp"
      # 웹 UI, DNS-over-HTTPS
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
      # 최초 설정 마법사
      - "127.0.0.1:3000:3000/tcp"
      # DNS-over-TLS, DNS-over-QUIC
      - "853:853/tcp"
      - "853:853/udp"
      # DNSCrypt
      - "5443:5443/tcp"
      - "5443:5443/udp"
    volumes:
      - adguard-home-work:/opt/adguardhome/work
      - adguard-home-conf:/opt/adguardhome/conf
    environment:
      TZ: Asia/Seoul
    security_opt:
      - no-new-privileges:true

volumes:
  adguard-home-work:
    driver: local
  adguard-home-conf:
    driver: local
