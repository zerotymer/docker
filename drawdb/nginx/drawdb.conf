# drawDB 리버스 프록시
# 컨테이너 nginx가 SPA 경로를 index.html로 넘긴다. 이 파일은 그 앞단이다.
# 공유와 메일 전송은 브라우저가 VITE_BACKEND_URL로 직접 호출한다. 이 업스트림으로 가지 않는다.
# 기본 설정이다. 배포 환경에 맞게 server_name, 인증서 경로, 업스트림 주소를 수정한다.
# http 컨텍스트에 포함한다 (예: /etc/nginx/conf.d/drawdb.conf).

upstream drawdb {
    # Nginx가 컨테이너이면 같은 네트워크의 컨테이너 이름(drawdb:80)으로 바꾼다
    server 127.0.0.1:5173;
}

server {
    listen 80;
    listen [::]:80;
    server_name drawdb.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name drawdb.example.com;

    ssl_certificate     /etc/nginx/certs/drawdb.example.com.crt;
    ssl_certificate_key /etc/nginx/certs/drawdb.example.com.key;

    location / {
        proxy_pass http://drawdb;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
