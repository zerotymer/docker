apiVersion: v1
kind: Pod
metadata:
  name: nexus
  namespace: nexus
  labels:
    app: nexus
spec:
  restartPolicy: Always
  terminationGracePeriodSeconds: 120
  containers:
    - name: nexus
      image: docker.io/sonatype/nexus3:latest
      ports:
        - containerPort: 8081
          hostPort: 8081
          hostIP: 127.0.0.1
      envFrom:
        - configMapRef:
            name: nexus-default
      volumeMounts:
        - name: nexus-vol
          mountPath: /nexus-data
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - NET_RAW
            - NET_ADMIN
      startupProbe:
        exec:
          command: ["curl", "-fsS", "http://localhost:8081/service/rest/v1/status"]
        periodSeconds: 10
        failureThreshold: 30
      livenessProbe:
        exec:
          command: ["curl", "-fsS", "http://localhost:8081/service/rest/v1/status"]
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 5

  # PVC는 Podman 이름 있는 볼륨이 되며, 처음 쓸 때 이미지의 /nexus-data 소유자(uid 200)로 맞춰진다
  volumes:
    - name: nexus-vol
      persistentVolumeClaim:
        claimName: nexus-vol

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexus-vol
  namespace: nexus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-default
  namespace: nexus
data:
  INSTALL4J_ADD_VM_PARAMS: "-Xms2g -Xmx2g -XX:MaxDirectMemorySize=2g -Djava.util.prefs.userRoot=/nexus-data/javaprefs"
  TZ: "Asia/Seoul"
