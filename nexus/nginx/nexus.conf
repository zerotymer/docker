# Nexus Repository 리버스 프록시
# 아티팩트 업로드를 위해 요청 크기를 1GB로 늘리고, 큰 파일 전송이 끊기지 않도록
# 타임아웃을 늘리고 버퍼링을 끈다 (Sonatype 리버스 프록시 예시 기준).
# Docker 저장소 커넥터 포트는 포함하지 않는다. 필요하면 server 블록을 따로 만든다.
# 기본 설정이다. 배포 환경에 맞게 server_name, 인증서 경로, 업스트림 주소를 수정한다.
# http 컨텍스트에 포함한다 (예: /etc/nginx/conf.d/nexus.conf).

upstream nexus {
    # Nginx가 컨테이너이면 같은 네트워크의 컨테이너 이름(nexus:8081)으로 바꾼다
    server 127.0.0.1:8081;
}

server {
    listen 80;
    listen [::]:80;
    server_name nexus.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nexus.example.com;

    ssl_certificate     /etc/nginx/certs/nexus.example.com.crt;
    ssl_certificate_key /etc/nginx/certs/nexus.example.com.key;

    client_max_body_size 1g;
    proxy_send_timeout 120s;
    proxy_read_timeout 300s;
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://nexus;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
