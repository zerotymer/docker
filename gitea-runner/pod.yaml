apiVersion: v1
kind: Pod
metadata:
  name: gitea-runner
  namespace: gitea
  labels:
    app: gitea-runner
spec:
  restartPolicy: Always
  containers:
    - name: runner
      image: docker.io/gitea/act_runner:0.6.1
      env:
        # podman-sock hostPath와 같은 경로를 유지한다
        - name: DOCKER_HOST
          value: "unix:///run/user/1000/podman/podman.sock"
      envFrom:
        - configMapRef:
            name: gitea-runner-default
        - secretRef:
            name: gitea-runner-secret
      volumeMounts:
        - name: gitea-runner-vol
          mountPath: /data
        - name: podman-sock
          mountPath: /run/user/1000/podman/podman.sock
      securityContext:
        allowPrivilegeEscalation: false
        seLinuxOptions:
          type: spc_t

  volumes:
    - name: gitea-runner-vol
      persistentVolumeClaim:
        claimName: gitea-runner-vol
    # rootless Podman 소켓 (UID 1000 기준, rootful은 /run/podman/podman.sock)
    - name: podman-sock
      hostPath:
        path: /run/user/1000/podman/podman.sock
        type: Socket

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-runner-vol
  namespace: gitea
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-runner-default
  namespace: gitea
data:
  # Gitea ROOT_URL과 같은 주소 (localhost, 127.0.0.1 불가)
  GITEA_INSTANCE_URL: "https://gitea.example.com"
  GITEA_RUNNER_NAME: "runner-01"
  GITEA_RUNNER_LABELS: "ubuntu-latest:docker://docker.gitea.com/runner-images:ubuntu-latest"

---
apiVersion: v1
kind: Secret
metadata:
  name: gitea-runner-secret
  namespace: gitea
type: Opaque
stringData:
  # 사이트 관리 > Actions > Runners 에서 발급한 등록 토큰으로 교체
  GITEA_RUNNER_REGISTRATION_TOKEN: "token"
