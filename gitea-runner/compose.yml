services:
  runner:
    image: docker.io/gitea/act_runner:0.6.1
    restart: unless-stopped
    env_file:
      - default.env
      - path: .env
        required: false
    environment:
      CONFIG_FILE: /config.yaml
      DOCKER_HOST: "unix://${DOCKER_SOCK:-/var/run/docker.sock}"
    volumes:
      - ./config.yml:/config.yaml:ro
      - ./.data:/data
      # job 컨테이너에도 같은 경로로 전달되므로 호스트와 컨테이너 경로를 일치시킨다
      - "${DOCKER_SOCK:-/var/run/docker.sock}:${DOCKER_SOCK:-/var/run/docker.sock}"
    security_opt:
      - no-new-privileges:true
