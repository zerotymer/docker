# =============================================================================
# Gitea + Gitea Runner - Docker Compose (공식 이미지, 2026-10 기준)
# -----------------------------------------------------------------------------
# 프로파일 (둘 중 하나만 기동 - 포트 동일):
#   latest : Gitea 28.1.0  + Runner 5.1.1
#   stable : Gitea 1.27.3  + Runner 4.1.0
#
#   docker compose --profile latest up -d
#   docker compose --profile stable up -d
#   (기본 프로파일 고정: .env 에 COMPOSE_PROFILES=stable 등 지정)
#
# 버전 메모
#   - Gitea 28.0 부터 "1." 접두어 제거 (1.28 이 아니라 28). 1.26.x 는 패치 중단 → 제외
#   - act_runner 는 2026-05 "Gitea Runner" 로 개명 (1.0.0 에서 버전 리셋)
#       gitea/act_runner (0.6.x, 2026-04 이후 갱신 없음) → legacy, 사용 안 함
#       gitea/runner     (현행, 메이저 버전이 빠르게 올라감)
#   - Runner 버전은 Gitea 버전과 독립 (Gitea 1.21+ 이면 연결 가능)
#
# ⚠ 데이터 디렉터리를 버전별로 분리
#   Gitea : 기동 시 DB 마이그레이션 수행, 다운그레이드 불가 → 절대 공유 금지
#   Runner: .runner(등록 정보)가 Gitea 인스턴스에 묶임 → Gitea 와 짝을 맞춰 분리
#
# Runner 최초 등록 (Gitea 설치 완료 후 1회):
#   1) 토큰 발급
#        docker exec -u git gitea-latest gitea actions generate-runner-token
#      (또는 웹: 사이트 관리 → Actions → Runners → 새 러너 생성)
#   2) runner/.env 에 GITEA_RUNNER_REGISTRATION_TOKEN=<토큰> 작성
#   3) docker compose --profile latest up -d   (등록 후 토큰은 다시 쓰이지 않음)
# =============================================================================

name: gitea

x-gitea-common: &gitea-common
  restart: always
  ports:
    - "3000:3000"
    - "2222:22"
  env_file:
    - path: ./default.env
      required: true
    - path: ./.env
      required: false
  networks:
    default:
      aliases: [gitea]               # 버전과 무관하게 runner 는 http://gitea:3000 으로 접속
  security_opt:
    - no-new-privileges:true
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s

x-runner-common: &runner-common
  restart: always
  env_file:
    - path: ./runner/default.env     # Gitea 와 분리: 등록 토큰이 Gitea 컨테이너로 새지 않도록
      required: true
    - path: ./runner/.env
      required: false
  security_opt:
    - no-new-privileges:true

services:

  # ---------------------------------------------------------------------------
  # latest : Gitea 28.x
  #   1.27 → 28 주요 breaking change (업그레이드 전 확인):
  #   - [server] DOMAIN 무시 → GITEA__server__ROOT_URL 필수
  #   - 셀프 회원가입 기본 비활성 (필요 시 명시적으로 허용)
  #   - 실시간 알림이 WebSocket(/-/ws) 으로 변경 → 리버스 프록시 Upgrade 헤더 전달 필요
  #   - Actions 완료 run 기본 400일 후 삭제 → 유지하려면 [actions] RUN_RETENTION_DAYS=0
  #   - 마이그레이션/미러 egress 가 내부 프록시 경유, [migrations] ALLOWED/BLOCKED_DOMAINS 등 deprecated
  # ---------------------------------------------------------------------------
  gitea-latest:
    <<: *gitea-common
    profiles: [latest]
    image: docker.gitea.com/gitea:28.1.0
    container_name: gitea-latest
    volumes:
      - ./.data-latest:/data:Z

  # ---------------------------------------------------------------------------
  # Runner 5.x (latest 짝)
  #   5.0 breaking change (워크플로 영향):
  #   - runs-on 없는 job 은 실패 (이전엔 default_image 사용)
  #   - builtin:checkout 이 actions/checkout 처럼 untracked 파일 정리 (clean: false 로 해제)
  #   - job 이미지에 Git 2.34.1+ 필요 (공식 runner-images 는 포함)
  #   - config.yaml 의 ${NAME} 을 환경변수로 치환, 미설정이면 로딩 실패 (리터럴은 $${NAME})
  # ---------------------------------------------------------------------------
  gitea-runner-latest:
    <<: *runner-common
    profiles: [latest]
    image: docker.io/gitea/runner:5.1.1
    container_name: gitea-runner-latest
    depends_on:
      gitea-latest:
        condition: service_healthy
    volumes:
      - ./runner/config.yaml:/config.yaml:ro
      - ./runner/.data-latest:/data:Z
      - /var/run/docker.sock:/var/run/docker.sock

  # ---------------------------------------------------------------------------
  # stable : Gitea 1.27.x (1.x 최종 라인)
  #   - 28.0 출시 이후 추가 패치는 기대하기 어려움 (이전 1.26 도 1.27 출시 후 중단)
  #   - 운영 안정성 확보용 단기 선택지, 28 검증 후 이관 권장
  # ---------------------------------------------------------------------------
  gitea-stable:
    <<: *gitea-common
    profiles: [stable]
    image: docker.gitea.com/gitea:1.27.3
    container_name: gitea-stable
    volumes:
      - ./.data-stable:/data:Z

  # ---------------------------------------------------------------------------
  # Runner 4.x (stable 짝) - 5.0 의 워크플로 breaking change 이전 마지막 라인
  #   - 4.x 유지보수 정책은 공지되지 않음 (Runner 는 약 1개월 단위로 메이저 상승)
  #   - 워크플로에 runs-on 명시 등 5.x 대응을 마친 뒤 5.x 로 올리는 것을 권장
  # ---------------------------------------------------------------------------
  gitea-runner-stable:
    <<: *runner-common
    profiles: [stable]
    image: docker.io/gitea/runner:4.1.0
    container_name: gitea-runner-stable
    depends_on:
      gitea-stable:
        condition: service_healthy
    volumes:
      - ./runner/config.yaml:/config.yaml:ro
      - ./runner/.data-stable:/data:Z
      - /var/run/docker.sock:/var/run/docker.sock