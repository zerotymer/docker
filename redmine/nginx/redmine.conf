# Redmine 리버스 프록시
# 첨부 파일 업로드가 Nginx 기본 제한(1m)에 막히지 않게 본문 크기를 늘린다.
# Redmine 관리 > 설정 > 파일의 최대 첨부 크기(기본 5MB)보다 크게 둔다.
# 기본 설정이다. 배포 환경에 맞게 server_name, 인증서 경로, 업스트림 주소를 수정한다.
# http 컨텍스트에 포함한다 (예: /etc/nginx/conf.d/redmine.conf).

upstream redmine {
    # Nginx가 컨테이너이면 같은 네트워크의 서비스 이름으로 바꾼다
    # sqlite는 redmine:3000, postgres는 redmine-postgres:3000, mysql은 redmine-mysql:3000
    server 127.0.0.1:3080;
}

server {
    listen 80;
    listen [::]:80;
    server_name redmine.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name redmine.example.com;

    ssl_certificate     /etc/nginx/certs/redmine.example.com.crt;
    ssl_certificate_key /etc/nginx/certs/redmine.example.com.key;

    client_max_body_size 100m;

    location / {
        proxy_pass http://redmine;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 큰 첨부 파일 업로드와 PDF, Gantt 내보내기가 기본 60초를 넘을 수 있다
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
