# WireMock 리버스 프록시
# 스텁 경로는 모두 허용하고, 관리 API(/__admin)는 내부망에서만 허용한다.
# 기본 설정이다. 배포 환경에 맞게 server_name, 업스트림 주소, 허용 대역을 수정한다.
# http 컨텍스트에 포함한다 (예: /etc/nginx/conf.d/wiremock.conf).

# 관리 API 허용 대역. 1이면 허용
# 다른 프록시나 로드밸런서 뒤에 있으면 set_real_ip_from, real_ip_header로
# 실제 클라이언트 IP를 먼저 복원해야 한다.
# rootless Podman에서 포트 포워딩이 원본 IP를 보존하지 않으면(rootlessport 등)
# 모든 요청이 내부 IP로 보여 차단이 무력화된다.
geo $wiremock_admin_allowed {
    default         0;
    127.0.0.0/8     1;
    ::1             1;
    10.0.0.0/8      1;
    172.16.0.0/12   1;
    192.168.0.0/16  1;
    fc00::/7        1;
}

upstream wiremock {
    # Nginx가 컨테이너이면 같은 네트워크의 컨테이너 이름(wiremock:8080)으로 바꾼다
    server 127.0.0.1:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name wiremock.example.com;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 관리 API. 외부에서는 경로가 없는 것처럼 404를 돌려준다
    # 위치 비교는 디코딩, 슬래시 병합한 URI로 하므로 %5F__admin, //__admin도 여기에 걸린다
    location ^~ /__admin {
        if ($wiremock_admin_allowed = 0) {
            return 404;
        }
        proxy_pass http://wiremock;
    }

    # 스텁
    location / {
        proxy_pass http://wiremock;
    }
}
