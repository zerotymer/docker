apiVersion: v1
kind: Pod
metadata:
  name: mysql
  namespace: mysql
  labels:
    app: mysql
spec:
  restartPolicy: Always
  containers:
    - name: mysql
      image: docker.io/library/mysql:9.7
      ports:
        - containerPort: 3306
          hostPort: 3306
          hostIP: 127.0.0.1
      envFrom:
        - configMapRef:
            name: mysql-default
        - secretRef:
            name: mysql-secret
      volumeMounts:
        - name: mysql-vol
          mountPath: /var/lib/mysql
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - NET_RAW
            - NET_ADMIN
      startupProbe:
        exec:
          command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
        periodSeconds: 10
        failureThreshold: 18
      livenessProbe:
        exec:
          command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 5

  volumes:
    - name: mysql-vol
      persistentVolumeClaim:
        claimName: mysql-vol

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-vol
  namespace: mysql
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-default
  namespace: mysql
data:
  TZ: "Asia/Seoul"
  MYSQL_DATABASE: "app"
  MYSQL_USER: "app"

---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: mysql
type: Opaque
stringData:
  # 실행 전 openssl rand -hex 32 값으로 교체
  MYSQL_ROOT_PASSWORD: "mysql"
  MYSQL_PASSWORD: "mysql"
