# LLM Registry 리버스 프록시
# 프론트엔드만 연다. 웹 UI, 에이전트 API(/api/v1/*), MCP(/api/v1/mcp)가 모두 프론트엔드를 거친다.
# API 포트(127.0.0.1:8000)는 공개하지 않는다.
# 기본 설정이다. 배포 환경에 맞게 server_name, 인증서 경로, 업스트림 주소를 수정한다.
# http 컨텍스트에 포함한다 (예: /etc/nginx/conf.d/llm-registry.conf).

upstream llm-registry {
    # Nginx가 컨테이너이면 같은 네트워크의 컨테이너 이름(llm-registry-front:3000)으로 바꾼다
    server 127.0.0.1:3030;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name llm-registry.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name llm-registry.example.com;

    ssl_certificate     /etc/nginx/certs/llm-registry.example.com.crt;
    ssl_certificate_key /etc/nginx/certs/llm-registry.example.com.key;

    # ingest 요청 본문. 더 큰 문서를 올리면 이 값과 Caddy 설정을 함께 늘린다
    client_max_body_size 32m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # MCP streamable-http. SSE 응답을 버퍼링하지 않고 긴 연결을 유지한다
    location ^~ /api/v1/mcp {
        proxy_pass http://llm-registry;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://llm-registry;
    }
}
