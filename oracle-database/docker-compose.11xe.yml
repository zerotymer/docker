services:
  oracle-11g:
    image: container-registry.oracle.com/database/enterprise:11.2.0.2-xe
    container_name: oracle11g
    restart: unless-stopped
    ports:
      - "1521:1521"
      - "8080:8080"
    volumes:
      - oracle11g_data:/u01/app/oracle
    shm_size: 1g

volumes:
  oracle11g_data: