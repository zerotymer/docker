apiVersion: v1
kind: Pod
metadata:
  name: svn-server
  namespace: svn-server
  labels:
    app: svn-server
spec:
  restartPolicy: Always
  containers:
    - name: svn-server
      image: docker.io/garethflowers/svn-server:edge
      ports:
        - containerPort: 3690
          hostPort: 3690
          hostIP: 127.0.0.1
      volumeMounts:
        # 이미지는 USER가 없어 root로 실행된다. U에 해당하는 소유권 변경은 하지 않는다
        - name: svn-server-vol
          mountPath: /var/opt/svn
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - NET_RAW
            - NET_ADMIN
      startupProbe:
        exec:
          command: ["sh", "-c", "netstat -ln | grep -q 3690"]
        periodSeconds: 5
        failureThreshold: 6
      livenessProbe:
        exec:
          command: ["sh", "-c", "netstat -ln | grep -q 3690"]
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3

  volumes:
    - name: svn-server-vol
      persistentVolumeClaim:
        claimName: svn-server-vol

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: svn-server-vol
  namespace: svn-server
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
