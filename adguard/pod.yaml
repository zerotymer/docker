apiVersion: v1
kind: Pod
metadata:
  name: adguard
  namespace: adguard
  labels:
    app: adguard
spec:
  restartPolicy: Always
  containers:
    - name: adguard
      image: docker.io/adguard/adguardhome:latest
      ports:
        # DNS
        - containerPort: 53
          hostPort: 53
          protocol: TCP
        - containerPort: 53
          hostPort: 53
          protocol: UDP
        # 웹 UI, DNS-over-HTTPS
        - containerPort: 80
          hostPort: 80
          protocol: TCP
        - containerPort: 443
          hostPort: 443
          protocol: TCP
        - containerPort: 443
          hostPort: 443
          protocol: UDP
        # 최초 설정 마법사
        - containerPort: 3000
          hostIP: 127.0.0.1
          hostPort: 3000
          protocol: TCP
        # DNS-over-TLS, DNS-over-QUIC
        - containerPort: 853
          hostPort: 853
          protocol: TCP
        - containerPort: 853
          hostPort: 853
          protocol: UDP
        # DNSCrypt
        - containerPort: 5443
          hostPort: 5443
          protocol: TCP
        - containerPort: 5443
          hostPort: 5443
          protocol: UDP
      envFrom:
        - configMapRef:
            name: adguard-default
      volumeMounts:
        - name: adguard-work
          mountPath: /opt/adguardhome/work
        - name: adguard-conf
          mountPath: /opt/adguardhome/conf
      securityContext:
        allowPrivilegeEscalation: false

  volumes:
    - name: adguard-work
      persistentVolumeClaim:
        claimName: adguard-work
    - name: adguard-conf
      persistentVolumeClaim:
        claimName: adguard-conf

---
# default.env와 같은 값을 유지
apiVersion: v1
kind: ConfigMap
metadata:
  name: adguard-default
  namespace: adguard
data:
  TZ: "Asia/Seoul"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguard-work
  namespace: adguard
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguard-conf
  namespace: adguard
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
