# AdGuard Home 리버스 프록시 (edge 종료)
# TLS는 프록시에서 끝내고 AdGuard Home 웹 UI(80)에는 HTTP로 넘긴다.
# AdGuard Home 암호화 설정의 HTTPS 리다이렉트(force_https)는 끈다.
# 웹 UI는 내부망에서만 허용하고, DNS-over-HTTPS(/dns-query)는 어디서나 허용한다.
# 기본 설정이다. 배포 환경에 맞게 server_name, 인증서 경로, 업스트림 주소, 허용 대역을 수정한다.
# http 컨텍스트에 포함한다 (예: /etc/nginx/conf.d/adguard.conf).

# 웹 UI 허용 대역. 1이면 허용
# 다른 프록시나 로드밸런서 뒤에 있으면 set_real_ip_from, real_ip_header로
# 실제 클라이언트 IP를 먼저 복원해야 한다.
geo $adguard_ui_allowed {
    default         0;
    127.0.0.0/8     1;
    ::1             1;
    10.0.0.0/8      1;
    172.16.0.0/12   1;
    192.168.0.0/16  1;
    fc00::/7        1;
}

upstream adguard {
    # Nginx가 컨테이너이면 같은 네트워크의 컨테이너 이름(adguard:80)으로 바꾼다
    server 127.0.0.1:80;
}

server {
    listen 80;
    listen [::]:80;
    server_name adguard.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name adguard.example.com;

    ssl_certificate     /etc/nginx/certs/adguard.example.com.crt;
    ssl_certificate_key /etc/nginx/certs/adguard.example.com.key;

    # 사용자 규칙, 허용/차단 목록을 한 번에 저장할 때 본문이 커질 수 있다
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # DNS-over-HTTPS. /dns-query/<ClientID> 형식도 포함한다
    # AdGuardHome.yaml에서 tls.allow_unencrypted_doh: true가 필요하다
    location ^~ /dns-query {
        proxy_pass http://adguard;
    }

    # 웹 UI. 외부에서는 경로가 없는 것처럼 404를 돌려준다
    location / {
        if ($adguard_ui_allowed = 0) {
            return 404;
        }
        proxy_pass http://adguard;
    }
}
