apiVersion: v1
kind: Pod
metadata:
  name: termix
  namespace: termix
  labels:
    app: termix
spec:
  restartPolicy: Always
  containers:
    - name: termix
      image: ghcr.io/lukegus/termix:latest
      ports:
        - containerPort: 8080
          hostPort: 8080
          hostIP: 127.0.0.1
      envFrom:
        - configMapRef:
            name: termix-default
      volumeMounts:
        - name: termix-vol
          mountPath: /app/data
      securityContext:
        allowPrivilegeEscalation: false
      startupProbe:
        exec:
          command: ["wget", "-q", "-O", "/dev/null", "http://localhost:30001/health"]
        periodSeconds: 5
        failureThreshold: 24
      livenessProbe:
        exec:
          command: ["wget", "-q", "-O", "/dev/null", "http://localhost:30001/health"]
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3

    - name: guacd
      image: docker.io/guacamole/guacd:1.6.0
      volumeMounts:
        - name: termix-vol
          mountPath: /termix-data
      securityContext:
        allowPrivilegeEscalation: false

  volumes:
    - name: termix-vol
      persistentVolumeClaim:
        claimName: termix-vol

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: termix-vol
  namespace: termix
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
# Pod 안의 컨테이너는 localhost로 서로 통신한다
apiVersion: v1
kind: ConfigMap
metadata:
  name: termix-default
  namespace: termix
data:
  PORT: "8080"
  GUACD_HOST: "127.0.0.1"
  GUACD_TUNNEL_HOST: "127.0.0.1"
  GUACD_RECORDING_PATH: "/termix-data/session_recordings/guacamole"
  GUACD_DRIVE_PATH: "/termix-data/rdp-drive"
