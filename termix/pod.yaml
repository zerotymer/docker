apiVersion: v1
kind: Pod
metadata:
  name: termix
  namespace: termix
  labels:
    app: termix
spec:
  restartPolicy: Always
  containers:
    - name: termix
      image: ghcr.io/termix-ssh/termix:latest
      ports:
        - containerPort: 8080
          hostPort: 8080
          hostIP: 127.0.0.1
      envFrom:
        - configMapRef:
            name: termix-default
      volumeMounts:
        - name: termix-vol
          mountPath: /app/data
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - NET_RAW
            - NET_ADMIN
      startupProbe:
        exec:
          command: ["wget", "-q", "-O", "/dev/null", "http://localhost:30001/health"]
        periodSeconds: 5
        failureThreshold: 24
      livenessProbe:
        exec:
          command: ["wget", "-q", "-O", "/dev/null", "http://localhost:30001/health"]
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3

  volumes:
    - name: termix-vol
      persistentVolumeClaim:
        claimName: termix-vol

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: termix-vol
  namespace: termix
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: termix-default
  namespace: termix
data:
  TZ: "Asia/Seoul"
  PORT: "8080"
