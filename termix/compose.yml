services:
  termix:
    image: ghcr.io/lukegus/termix:latest
    container_name: termix
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - termix-vol:/app/data
    env_file:
      - default.env
      - path: .env
        required: false
    security_opt:
      - no-new-privileges:true
    depends_on:
      - guacd
    networks:
      - termix-net

  guacd:
    image: docker.io/guacamole/guacd:1.6.0
    container_name: termix-guacd
    restart: unless-stopped
    volumes:
      - termix-vol:/termix-data
    security_opt:
      - no-new-privileges:true
    networks:
      - termix-net

networks:
  termix-net:
    driver: bridge

volumes:
  termix-vol:
    driver: local
