# Termix 리버스 프록시
# 터미널, 원격 데스크톱, 실시간 갱신이 WebSocket을 쓰고 유휴 세션이 오래 유지되므로
# Upgrade 헤더를 넘기고 타임아웃을 길게 둔다. 파일 관리자 업로드 크기는 제한하지 않는다.
# 기본 설정이다. 배포 환경에 맞게 server_name, 인증서 경로, 업스트림 주소를 수정한다.
# http 컨텍스트에 포함한다 (예: /etc/nginx/conf.d/termix.conf).

# 다른 설정의 $connection_upgrade와 겹치지 않게 이름을 따로 둔다
map $http_upgrade $termix_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream termix {
    # Nginx가 컨테이너이면 같은 네트워크의 컨테이너 이름(termix:8080)으로 바꾼다
    server 127.0.0.1:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name termix.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name termix.example.com;

    ssl_certificate     /etc/nginx/certs/termix.example.com.crt;
    ssl_certificate_key /etc/nginx/certs/termix.example.com.key;

    client_max_body_size 0;

    location / {
        proxy_pass http://termix;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $termix_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_request_buffering off;
    }
}
