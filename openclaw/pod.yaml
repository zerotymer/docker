apiVersion: v1
kind: Pod
metadata:
  name: openclaw
  namespace: openclaw
  labels:
    app: openclaw
spec:
  restartPolicy: Always
  containers:
    - name: openclaw
      image: ghcr.io/openclaw/openclaw:latest
      args: ["node", "openclaw.mjs", "gateway", "--bind", "lan", "--port", "18789"]
      ports: 
        - containerPort: 18789
          hostPort: 18789
          hostIP: 127.0.0.1
      volumeMounts:
        - name: openclaw-vol
          mountPath: /home/node/.openclaw
        - name: openclaw-workspace
          mountPath: /home/node/.openclaw/workspace
      envFrom:
        - secretRef:
            name: openclaw-secret
      env:
        - name: NODE_ENV
          value: production
      resources:
        limits: 
          cpu: "2"
          memory: "4Gi"
      startupProbe:
        httpGet: 
          path: /startupz
          port: 18789
        periodSeconds: 5
        failureThreshold: 12
      livenessProbe:
        exec:
          command: ["node", "dist/docker-healthcheck.js"]
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 5

  volumes:
    - name: openclaw-vol
      persistentVolumeClaim:
        claimName: openclaw-vol
    - name: openclaw-workspace
      persistentVolumeClaim:
        claimName: openclaw-workspace

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-vol
  namespace: openclaw
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-workspace
  namespace: openclaw
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: Secret
metadata:
  name: openclaw-secret
  namespace: openclaw
type: Opaque
stringData:
  # 실행 전 openssl rand -hex 32 값으로 교체
  OPENCLAW_GATEWAY_TOKEN: "token"

