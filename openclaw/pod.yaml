apiVersion: v1
kind: Pod
metadata:
  name: openclaw
  namespace: openclaw
  labels: openclaw
spec:
  restartPolicy: Always
  containers:
    - name: openclaw
      image: ghcr.io/openclaw/openclaw:latest
      ports: 
        - containerPort: 18789
          hostPort: 18789
      volumeMounts:
        - name: openclaw-vol
          mountPath: /home/node/.openclaw
        - name: openclaw-workspace
          mountPath: /home/node/.openclaw/workspace
      envFrom:
        - secretRef:
          name: openclaw-secret
      env:
        - name: NODE_ENV
          value: production
      resources:
        limits: 
          cpu: "1"
          memory: "4Gi"
      startupProbe:
        httpGet: 
          path: /healthz
          port: 18789
          periodSecods: 15

    - name: openclaw-cli
      image: ghcr.io/openclaw/openclaw:lastest
      volumeMounts:
        - name: openclaw-vol
          mountPath: /home/node/.openclaw
        - name: openclaw-workspace
          mountPath: /home/node/.openclaw/workspace
      command:
        - "openclaw"


  volumes:
    - name: openclaw-vol
      persistentVolumeClaim:
        claimName: openclaw-vol
    - name: openclaw-workspace
      persistentVolumeClaim:
        claimName: openclaw-workspace

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-vol
  namespace: openclaw
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: persistentVolumeClaim
metadata:
  name: openclaw-workspace
  namespace: openclaw
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    request:
      storage: 1Gi

---
apiVersion: v1
kind: Secret
metadata:
  name: openclaw-secret
  namespace: openclaw
type: Opaque
data:
  OPENCLAW_GATEWAY_TOKEN: "token"

