apiVersion: v1
kind: Pod
metadata:
  name: postgresql
  namespace: postgresql
  labels:
    app: postgresql
spec:
  restartPolicy: Always
  containers:
    - name: postgresql
      image: docker.io/library/postgres:18
      ports:
        - containerPort: 5432
          hostPort: 5432
          hostIP: 127.0.0.1
      envFrom:
        - configMapRef:
            name: postgresql-default
        - secretRef:
            name: postgresql-secret
      volumeMounts:
        - name: postgresql-vol
          mountPath: /var/lib/postgresql
        - name: postgresql-shm
          mountPath: /dev/shm
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - NET_RAW
            - NET_ADMIN
      startupProbe:
        exec:
          command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
        periodSeconds: 5
        failureThreshold: 12
      livenessProbe:
        exec:
          command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 5

  volumes:
    - name: postgresql-vol
      persistentVolumeClaim:
        claimName: postgresql-vol
    - name: postgresql-shm
      emptyDir:
        medium: Memory
        sizeLimit: 256Mi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-vol
  namespace: postgresql
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-default
  namespace: postgresql
data:
  POSTGRES_DB: "postgres"
  POSTGRES_USER: "postgres"
  TZ: "Asia/Seoul"
  PGTZ: "Asia/Seoul"

---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: postgresql
type: Opaque
stringData:
  # 실행 전 openssl rand -hex 32 값으로 교체
  POSTGRES_PASSWORD: "postgres"
