apiVersion: v1
kind: Pod
metadata:
  name: postgresql
  namespace: postgresql
  labels:
    app: postgresql
spec:
  restartPolicy: Always
  containers:
    - name: postgresql
      image: ghcr.io/pgmq/pg18-pgmq:v1.10.0
      ports:
        - containerPort: 5432
          hostPort: 5432
          hostIP: 127.0.0.1
      envFrom:
        - configMapRef:
            name: postgresql-default
        - secretRef:
            name: postgresql-secret
      volumeMounts:
        - name: postgresql-vol
          mountPath: /var/lib/postgresql
        - name: postgresql-init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        - name: postgresql-shm
          mountPath: /dev/shm
      securityContext:
        allowPrivilegeEscalation: false
      startupProbe:
        exec:
          command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
        periodSeconds: 5
        failureThreshold: 12
      livenessProbe:
        exec:
          command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 5

  volumes:
    - name: postgresql-vol
      persistentVolumeClaim:
        claimName: postgresql-vol
    - name: postgresql-init
      configMap:
        name: postgresql-init
    - name: postgresql-shm
      emptyDir:
        medium: Memory
        sizeLimit: 256Mi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-vol
  namespace: postgresql
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-default
  namespace: postgresql
data:
  POSTGRES_DB: "pgmq_lab"
  POSTGRES_USER: "postgres"
  TZ: "Asia/Seoul"
  PGTZ: "Asia/Seoul"

---
# init/01-pgmq.sql과 같은 내용을 유지
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init
  namespace: postgresql
data:
  01-pgmq.sql: |
    \set ON_ERROR_STOP on
    CREATE EXTENSION IF NOT EXISTS pgmq;
    SELECT pgmq.create('test_queue');

---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: postgresql
type: Opaque
stringData:
  # 실행 전 openssl rand -hex 32 값으로 교체
  POSTGRES_PASSWORD: "postgres"
