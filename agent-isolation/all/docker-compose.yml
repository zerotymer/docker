services:
  agent:
    container_name: agents
    image: zerotymer/agent-isolation:latest-all
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    networks:
      - agent-net
    volumes:
      - .workspace:/workspace
      - agent-vol:/home/agent/


networks:
  agent-net:
    driver: bridge

volumes:
  agent-vol:
    driver: local
